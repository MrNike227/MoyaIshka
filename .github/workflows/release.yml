name: Build Windows release — verified 4.1.8.2

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: moyaishka-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and verify Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify active Python and install dependencies
        shell: pwsh
        run: |
          python --version
          python -c "import struct, sys; assert struct.calcsize('P') * 8 == 64, '64-bit Python is required'; print(sys.executable)"
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -c "import cryptography, cffi, _cffi_backend; from cryptography.exceptions import InvalidTag; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; from cryptography.hazmat.primitives.kdf.scrypt import Scrypt; print('cryptography preflight OK:', cryptography.__version__)"

      - name: Run release configuration tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build standalone EXE
        shell: cmd
        env:
          MOYA_BUILD_PYTHON: python
          GITHUB_ACTIONS: 'true'
        run: BUILD_EXE.bat

      - name: Verify x64 VC runtime and Universal CRT DLLs are embedded
        shell: pwsh
        run: |
          $exePath = (Resolve-Path 'dist/MoyaIshka.exe').Path
          $archiveListing = (& pyi-archive_viewer -l $exePath 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the PyInstaller archive.'
          }
          foreach ($dll in @('python311.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'ucrtbase.dll', 'api-ms-win-crt-runtime-l1-1-0.dll')) {
            if ($archiveListing -notmatch [regex]::Escape($dll)) {
              throw "Required app-local runtime DLL is missing from the EXE archive: $dll"
            }
          }

      - name: Verify EXE starts without Python on PATH
        shell: pwsh
        run: |
          $exePath = (Resolve-Path 'dist/MoyaIshka.exe').Path
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $exePath
          $startInfo.Arguments = '--self-test-imports'
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          # Keep only Windows system folders in PATH; Python and its Scripts directory are excluded.
          $startInfo.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = [System.Diagnostics.Process]::Start($startInfo)
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Standalone EXE did not finish its isolated startup test within 120 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Standalone EXE failed without Python on PATH (exit code $($process.ExitCode))."
          }

      - name: Verify frozen EXE imports and encryption round-trip
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/MoyaIshka.exe')) {
            throw 'PyInstaller did not create dist/MoyaIshka.exe'
          }
          $exePath = (Resolve-Path 'dist/MoyaIshka.exe').Path
          $process = Start-Process -FilePath $exePath -ArgumentList '--self-test-imports' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen EXE cryptography smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path 'dist/MoyaIshka.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoyaIshka.exe" | Set-Content -Path 'dist/MoyaIshka.exe.sha256' -Encoding ascii

      - name: Create release or replace assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" 'dist/MoyaIshka.exe' 'dist/MoyaIshka.exe.sha256' --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$tag" 'dist/MoyaIshka.exe' 'dist/MoyaIshka.exe.sha256' --title "Моя ИИшка $tag" --generate-notes --repo "$env:GITHUB_REPOSITORY"
          }
