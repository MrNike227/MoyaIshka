name: Build Windows release — verified 4.1.5.2

on:
  push:
    tags:
      - 'v4.1.5.2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.11 x64
        id: setup-python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Verify version, dependencies and tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip check
          python -m compileall -q .
          $version = python -c "import main; print(main.APP_VERSION)"
          if ($version -ne '4.1.5.2') { throw "Expected application version 4.1.5.2, got '$version'" }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne 'v4.1.5.2') {
            throw "Refusing to publish an unexpected release tag: $env:GITHUB_REF_NAME"
          }
          python -m unittest discover -s tests -v

      - name: Build standalone EXE using canonical build script
        shell: cmd
        run: call BUILD_EXE.bat
        env:
          MOYA_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Verify frozen EXE imports and encryption round-trip
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/MoyaIshka.exe'
          python -c "import subprocess, sys; result = subprocess.run([r'dist\MoyaIshka.exe', '--self-test-imports'], timeout=90); sys.exit(result.returncode)"
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE crypto/CFFI self-test failed or timed out: $LASTEXITCODE" }
          python -c "from PyInstaller.archive.readers import CArchiveReader; a=CArchiveReader(r'dist/MoyaIshka.exe'); n=[str(x).lower() for x in a.toc]; assert any('cryptography' in x for x in n), 'cryptography package missing from EXE'; assert any('cryptography' in x and '_rust' in x for x in n), 'cryptography Rust binding missing from EXE'; assert any('_cffi_backend' in x for x in n), '_cffi_backend missing from EXE'; assert any(x.startswith('cffi.') or x == 'cffi' for x in n), 'cffi package missing from EXE'; print('Verified crypto/CFFI archive entries:', sum('cryptography' in x or 'cffi' in x for x in n))"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path 'dist/MoyaIshka.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoyaIshka.exe" | Set-Content -Path 'dist/MoyaIshka.exe.sha256' -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'dist/MoyaIshka.exe' `
            'dist/MoyaIshka.exe.sha256' `
            --title "Моя ИИшка $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
