name: Verify Windows build — 4.1.5.2

on:
  push:
    branches:
      - 'fix/4.1.5.2-verified-build'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.11 x64
        id: setup-python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Verify version, dependencies and tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip check
          $version = python -c "import main; print(main.APP_VERSION)"
          if ($version -ne '4.1.5.2') { throw "Expected application version 4.1.5.2, got '$version'" }
          python -m unittest discover -s tests -v

      - name: Build standalone EXE using canonical build script
        shell: cmd
        run: call BUILD_EXE.bat
        env:
          MOYA_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}

      - name: Verify frozen EXE imports and encryption round-trip
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/MoyaIshka.exe'
          & $exe --self-test-imports
          if ($LASTEXITCODE -ne 0) { throw "Frozen EXE cryptography self-test failed: $LASTEXITCODE" }
          python -c "from PyInstaller.archive.readers import CArchiveReader; a=CArchiveReader(r'dist/MoyaIshka.exe'); n=[str(x).lower() for x in a.toc]; assert any('cryptography' in x for x in n), 'cryptography package missing from EXE'; assert any('cryptography' in x and '_rust' in x for x in n), 'cryptography Rust binding missing from EXE'; print('Verified cryptography archive entries:', sum('cryptography' in x for x in n))"
